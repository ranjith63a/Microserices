spring.application.name=student-service

# ?? Database ?????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/Student
spring.datasource.username=inventoryadmin
spring.datasource.password=spring
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? Eureka ????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ?? Feign + Circuit Breaker ???????????????????????????????????????
spring.cloud.openfeign.circuitbreaker.enabled=true

# ?? Redis ?????????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ?? Resilience4j: Circuit Breaker ????????????????????????????????
resilience4j.circuitbreaker.instances.department-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.department-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.department-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.department-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.department-service.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.department-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.department-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.department-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.department-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.department-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.department-service.record-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,feign.FeignException
resilience4j.circuitbreaker.instances.department-service.ignore-exceptions=java.lang.IllegalArgumentException

# ?? Resilience4j: Retry ???????????????????????????????????????????
resilience4j.retry.instances.department-service.max-attempts=3
resilience4j.retry.instances.department-service.wait-duration=1s
resilience4j.retry.instances.department-service.enable-exponential-backoff=true
resilience4j.retry.instances.department-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.department-service.exponential-max-wait-duration=10s
resilience4j.retry.instances.department-service.retry-exceptions=java.io.IOException,feign.FeignException
resilience4j.retry.instances.department-service.ignore-exceptions=java.lang.IllegalArgumentException

# ?? Resilience4j: Rate Limiter ????????????????????????????????????
resilience4j.ratelimiter.instances.department-service.limit-for-period=100
resilience4j.ratelimiter.instances.department-service.limit-refresh-period=1s
resilience4j.ratelimiter.instances.department-service.timeout-duration=500ms
resilience4j.ratelimiter.instances.department-service.register-health-indicator=true

# ?? Resilience4j: Bulkhead (Semaphore) ???????????????????????????
resilience4j.bulkhead.instances.department-service.max-concurrent-calls=20
resilience4j.bulkhead.instances.department-service.max-wait-duration=100ms

# ?? Actuator ??????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,ratelimiters
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.endpoint.health.show-details=always